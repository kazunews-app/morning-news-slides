name: Update Trend News

on:
  schedule:
    # 5分ごとに自動更新
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/update_news.py'
      - '.github/workflows/update-news.yml'

concurrency:
  group: update-trend-news
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and summarize news with source images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/update_news.py

      - name: Commit and push updated news.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.js
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update trend news with source images"
          for i in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main && git push origin HEAD:main && break
            echo "Push retry $i..."
            sleep 2
          done
