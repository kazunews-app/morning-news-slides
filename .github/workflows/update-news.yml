name: Update Trend News

on:
  schedule:
    # 1時間ごとに自動更新（毎時05分）
    - cron: '5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/update_news.py'
      - '.github/workflows/update-news.yml'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and summarize news with source images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/update_news.py

      - name: Commit and push updated news.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.js
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update trend news with source images"
            git pull --rebase origin main
            git push
          fi
