<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TREND NEWS" />
  <link rel="apple-touch-icon" href="assets/images/news-3.jpg" />
  <title>TREND NEWS — トレンドニュース速報</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- スティッキーヘッダー -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-top">
        <a href="#" class="brand" id="brand-reset">
          <span class="brand-badge">LIVE</span>
          <div class="brand-text">
            <span class="brand-title">TREND NEWS</span>
            <span class="brand-meta" id="header-updated">更新: --</span>
          </div>
        </a>

        <!-- 検索バー -->
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="search" id="search-input" placeholder="キーワードでニュースを検索..." aria-label="ニュース検索" />
          <button type="button" class="search-clear" id="search-clear" hidden aria-label="検索をクリア">✕</button>
        </div>

        <!-- アクションボタン -->
        <div class="header-actions">
          <button class="icon-btn" id="btn-refresh" title="最新の情報に再読み込み" aria-label="再読み込み">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </button>
          <button class="icon-btn" id="btn-theme" title="ダーク／ライトモード切替" aria-label="テーマ切替">
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- カテゴリナビゲーション -->
      <nav class="category-nav" aria-label="ニュースカテゴリ">
        <button class="nav-tab active" data-category="all">
          <span>トップ</span>
          <span class="tab-count" id="count-all">0</span>
        </button>
        <button class="nav-tab" data-category="domestic">
          <span>🇯🇵 国内・総合</span>
          <span class="tab-count" id="count-domestic">0</span>
        </button>
        <button class="nav-tab" data-category="tech">
          <span>🤖 テクノロジー・AI</span>
          <span class="tab-count" id="count-tech">0</span>
        </button>
        <button class="nav-tab" data-category="business">
          <span>📈 ビジネス・経済</span>
          <span class="tab-count" id="count-business">0</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- トレンドキーワードティッカー -->
  <div class="trending-bar">
    <div class="trending-inner">
      <span class="trending-label">🔥 注目の話題</span>
      <div class="trending-tags" id="trending-tags"></div>
    </div>
  </div>

  <!-- メインニュースフィード -->
  <main class="main-container">
    <!-- 検索・フィルタ状態の表示 -->
    <div class="filter-status" id="filter-status" hidden>
      <span id="filter-status-text"></span>
      <button type="button" class="text-btn" id="btn-clear-filter">すべて表示に戻す</button>
    </div>

    <!-- トップピックアップセクション（トップ表示・未検索時のみ表示） -->
    <section class="hero-section" id="hero-section">
      <div class="hero-lead" id="hero-lead"></div>
      <aside class="hero-side">
        <div class="side-header">
          <h2>⚡ 速報・ピックアップ</h2>
        </div>
        <div class="side-list" id="hero-side-list"></div>
      </aside>
    </section>

    <!-- 記事一覧セクション -->
    <section class="feed-section">
      <div class="section-header">
        <h2 id="feed-heading">最新ニュース一覧</h2>
        <span class="feed-count" id="feed-count"></span>
      </div>
      <div class="news-grid" id="news-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>TREND NEWS — 毎時間自動更新（Google News / はてなブックマークIT / Zenn）</p>
  </footer>

  <!-- 記事要約リーダーモーダル -->
  <div class="article-modal" id="article-modal" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="modal-close" id="modal-close" aria-label="閉じる">✕</button>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <script src="data/news.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
